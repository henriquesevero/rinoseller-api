basePath: /api
definitions:
  domain.BrandCatalog:
    properties:
      brand_name:
        type: string
      created_at:
        type: string
      drive_url:
        type: string
      id:
        type: string
      user_id:
        type: string
    type: object
  domain.CapitalContribution:
    properties:
      amount:
        $ref: '#/definitions/domain.Money'
      created_at:
        type: string
      description:
        type: string
      hidden:
        type: boolean
      id:
        type: string
      type:
        $ref: '#/definitions/domain.ContributionType'
      user_id:
        type: string
    type: object
  domain.Client:
    properties:
      address:
        type: string
      cpf_cnpj:
        $ref: '#/definitions/domain.CpfCnpj'
      created_at:
        type: string
      debt:
        $ref: '#/definitions/domain.Money'
      debt_limit:
        $ref: '#/definitions/domain.Money'
      email:
        type: string
      id:
        type: string
      name:
        type: string
      notes:
        type: string
      payment_cycle_amount:
        $ref: '#/definitions/domain.Money'
      payment_cycle_days:
        type: integer
      phone:
        $ref: '#/definitions/domain.Phone'
      user_id:
        type: string
    type: object
  domain.ClientPayment:
    properties:
      amount:
        $ref: '#/definitions/domain.Money'
      client_id:
        type: string
      count_as_revenue:
        type: boolean
      created_at:
        type: string
      id:
        type: string
      notes:
        type: string
      user_id:
        type: string
    type: object
  domain.ContributionType:
    enum:
    - aporte
    - retirada
    type: string
    x-enum-varnames:
    - ContributionAporte
    - ContributionRetirada
  domain.CpfCnpj:
    type: object
  domain.Expense:
    properties:
      amount:
        $ref: '#/definitions/domain.Money'
      created_at:
        type: string
      description:
        type: string
      due_date:
        type: string
      id:
        type: string
      notes:
        type: string
      paid_at:
        type: string
      payment_method:
        type: string
      status:
        $ref: '#/definitions/domain.ExpenseStatus'
      supplier:
        type: string
      user_id:
        type: string
    type: object
  domain.ExpenseStatus:
    enum:
    - Pendente
    - Pago
    type: string
    x-enum-varnames:
    - ExpenseStatusPending
    - ExpenseStatusPaid
  domain.KitItem:
    properties:
      product_id:
        type: string
      product_name:
        type: string
      quantity:
        type: integer
    type: object
  domain.Money:
    type: object
  domain.Order:
    properties:
      client_name:
        type: string
      client_phone:
        type: string
      created_at:
        type: string
      id:
        type: string
      items:
        items:
          $ref: '#/definitions/domain.OrderItem'
        type: array
      status:
        $ref: '#/definitions/domain.OrderStatus'
      total:
        $ref: '#/definitions/domain.Money'
      user_id:
        type: string
    type: object
  domain.OrderItem:
    properties:
      price:
        $ref: '#/definitions/domain.Money'
      product_id:
        type: string
      product_name:
        type: string
      quantity:
        type: integer
    type: object
  domain.OrderStatus:
    enum:
    - Pronta-Entrega
    - Encomenda
    type: string
    x-enum-varnames:
    - OrderStatusReady
    - OrderStatusBackorder
  domain.PaymentType:
    enum:
    - Personalizado
    type: string
    x-enum-varnames:
    - PaymentTypeCustom
  domain.Phone:
    type: object
  domain.Plan:
    enum:
    - trial
    - base
    - professional
    - ai
    type: string
    x-enum-varnames:
    - PlanTrial
    - PlanBase
    - PlanProfessional
    - PlanAI
  domain.Product:
    properties:
      brand:
        type: string
      category:
        type: string
      code:
        type: string
      cost_price:
        $ref: '#/definitions/domain.Money'
      id:
        type: string
      is_kit:
        type: boolean
      kit_items:
        items:
          $ref: '#/definitions/domain.KitItem'
        type: array
      name:
        type: string
      price:
        $ref: '#/definitions/domain.Money'
      stock_quantity:
        type: integer
      user_id:
        type: string
    type: object
  domain.Quote:
    properties:
      approved_at:
        type: string
      client_id:
        type: string
      client_name:
        type: string
      created_at:
        type: string
      delivered_at:
        type: string
      id:
        type: string
      installments:
        type: integer
      invoiced_at:
        type: string
      items:
        items:
          $ref: '#/definitions/domain.QuoteItem'
        type: array
      notes:
        type: string
      payment_type:
        $ref: '#/definitions/domain.PaymentType'
      status:
        $ref: '#/definitions/domain.QuoteStatus'
      total:
        $ref: '#/definitions/domain.Money'
      user_id:
        type: string
    type: object
  domain.QuoteItem:
    properties:
      kit_items:
        items:
          $ref: '#/definitions/domain.KitItem'
        type: array
      product_id:
        type: string
      product_name:
        type: string
      quantity:
        type: integer
      subtotal:
        $ref: '#/definitions/domain.Money'
      unit_price:
        $ref: '#/definitions/domain.Money'
    type: object
  domain.QuoteStatus:
    enum:
    - Aguardando Aprovação
    - Aprovado
    - Faturado
    - Faturado Gradual
    - Entregue
    - Cancelado
    type: string
    x-enum-varnames:
    - QuoteStatusAwaitingApproval
    - QuoteStatusApproved
    - QuoteStatusInvoiced
    - QuoteStatusInvoicedGradual
    - QuoteStatusDelivered
    - QuoteStatusCancelled
  domain.User:
    properties:
      active:
        type: boolean
      created_at:
        type: string
      email:
        type: string
      email_verified:
        type: boolean
      id:
        type: string
      name:
        type: string
      plan:
        $ref: '#/definitions/domain.Plan'
      role:
        $ref: '#/definitions/domain.UserRole'
      subscription_active:
        type: boolean
      trial_ends_at:
        type: string
    type: object
  domain.UserRole:
    enum:
    - admin
    - seller
    type: string
    x-enum-varnames:
    - RoleAdmin
    - RoleSeller
  httphandler.addDebtRequest:
    properties:
      amount:
        example: 200
        type: number
    type: object
  httphandler.authResponse:
    properties:
      token:
        example: eyJhbGciOiJIUzI1NiIs...
        type: string
      user:
        $ref: '#/definitions/domain.User'
    type: object
  httphandler.checkoutRequest:
    properties:
      cvv:
        example: "123"
        type: string
      email:
        example: joao@email.com
        type: string
      expiry_month:
        example: "12"
        type: string
      expiry_year:
        example: "2030"
        type: string
      holder_name:
        example: João Silva
        type: string
      number:
        example: "4444444444444444"
        type: string
      plan:
        example: professional
        type: string
    required:
    - cvv
    - email
    - expiry_month
    - expiry_year
    - holder_name
    - number
    - plan
    type: object
  httphandler.clientRequest:
    properties:
      address:
        type: string
      cpf_cnpj:
        type: string
      debt_limit:
        type: number
      email:
        type: string
      name:
        type: string
      notes:
        type: string
      payment_cycle_amount:
        type: number
      payment_cycle_days:
        type: integer
      phone:
        type: string
    required:
    - name
    type: object
  httphandler.createBrandCatalogRequest:
    properties:
      brand_name:
        type: string
      drive_url:
        type: string
    required:
    - brand_name
    - drive_url
    type: object
  httphandler.createCapitalContributionRequest:
    properties:
      amount:
        type: number
      description:
        type: string
      type:
        type: string
    required:
    - amount
    type: object
  httphandler.createExpenseRequest:
    properties:
      amount:
        type: number
      description:
        type: string
      due_date:
        type: string
      notes:
        type: string
      payment_method:
        type: string
      supplier:
        type: string
    required:
    - amount
    - description
    type: object
  httphandler.createOrderRequest:
    properties:
      client_name:
        type: string
      client_phone:
        type: string
      items:
        items:
          $ref: '#/definitions/httphandler.orderItemRequest'
        minItems: 1
        type: array
    required:
    - items
    type: object
  httphandler.createProductRequest:
    properties:
      brand:
        type: string
      category:
        type: string
      code:
        type: string
      cost_price:
        type: number
      is_kit:
        type: boolean
      kit_items:
        items:
          $ref: '#/definitions/httphandler.kitItemRequest'
        type: array
      name:
        type: string
      price:
        type: number
      stock_quantity:
        type: integer
    required:
    - name
    type: object
  httphandler.createQuoteRequest:
    properties:
      client_id:
        type: string
      installments:
        type: integer
      items:
        items:
          $ref: '#/definitions/httphandler.quoteItemRequest'
        minItems: 1
        type: array
      notes:
        type: string
      payment_type:
        type: string
    required:
    - client_id
    - items
    type: object
  httphandler.createUserRequest:
    properties:
      email:
        example: maria@email.com
        type: string
      name:
        example: Maria
        type: string
      password:
        example: "123456"
        type: string
      role:
        example: seller
        type: string
    required:
    - email
    - name
    - password
    type: object
  httphandler.errorResponse:
    properties:
      code:
        example: email_not_verified
        type: string
      error:
        example: mensagem de erro
        type: string
    type: object
  httphandler.forgotPasswordRequest:
    properties:
      email:
        example: joao@email.com
        type: string
    type: object
  httphandler.kitItemRequest:
    properties:
      product_id:
        type: string
      quantity:
        type: integer
    type: object
  httphandler.loginRequest:
    properties:
      email:
        example: admin@rinoseller.com
        type: string
      password:
        example: "123456"
        type: string
    required:
    - email
    - password
    type: object
  httphandler.messageResponse:
    properties:
      message:
        example: operação realizada com sucesso
        type: string
    type: object
  httphandler.orderItemRequest:
    properties:
      product_id:
        type: string
      quantity:
        type: integer
    required:
    - product_id
    - quantity
    type: object
  httphandler.quoteItemRequest:
    properties:
      product_id:
        type: string
      quantity:
        type: integer
    required:
    - product_id
    - quantity
    type: object
  httphandler.registerPaymentRequest:
    properties:
      amount:
        example: 150
        type: number
      count_as_revenue:
        example: true
        type: boolean
      notes:
        example: Pagamento parcial
        type: string
    type: object
  httphandler.registerRequest:
    properties:
      email:
        example: joao@email.com
        type: string
      name:
        example: João Silva
        type: string
      password:
        example: "123456"
        type: string
      plan:
        example: trial
        type: string
    required:
    - email
    - name
    - password
    - plan
    type: object
  httphandler.resendVerificationRequest:
    properties:
      email:
        example: joao@email.com
        type: string
    required:
    - email
    type: object
  httphandler.resetPasswordRequest:
    properties:
      password:
        example: novaSenha123
        type: string
      token:
        example: abc123
        type: string
    type: object
  httphandler.sendQuoteEmailRequest:
    properties:
      kind:
        example: orcamento
        type: string
      pdf_base64:
        type: string
    required:
    - kind
    - pdf_base64
    type: object
  httphandler.updatePriceRequest:
    properties:
      price:
        example: 29.9
        type: number
    type: object
  httphandler.updateStockRequest:
    properties:
      quantity:
        example: 50
        type: integer
    type: object
  httphandler.updateUserRequest:
    properties:
      active:
        example: true
        type: boolean
      email:
        example: maria@email.com
        type: string
      name:
        example: Maria Silva
        type: string
    type: object
  httphandler.verifyEmailRequest:
    properties:
      token:
        example: abc123
        type: string
    required:
    - token
    type: object
host: localhost:8080
info:
  contact: {}
  description: API do sistema RinoSeller — gestão de vendas, clientes, produtos, orçamentos
    e finanças.
  title: RinoSeller API
  version: "1.0"
paths:
  /auth/forgot-password:
    post:
      consumes:
      - application/json
      parameters:
      - description: E-mail
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httphandler.forgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httphandler.messageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httphandler.errorResponse'
      summary: Esqueci a senha
      tags:
      - Auth
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Credenciais
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httphandler.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httphandler.authResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httphandler.errorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httphandler.errorResponse'
      summary: Login
      tags:
      - Auth
  /auth/me:
    delete:
      description: Remove permanentemente a conta do usuário autenticado e todos os
        dados associados a ela (produtos, clientes, pedidos, orçamentos, etc).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httphandler.messageResponse'
      security:
      - BearerAuth: []
      summary: Excluir minha conta
      tags:
      - Auth
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.User'
      security:
      - BearerAuth: []
      summary: Meu perfil
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: Dados de registro
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httphandler.registerRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/httphandler.messageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httphandler.errorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httphandler.errorResponse'
      summary: Registrar conta
      tags:
      - Auth
  /auth/resend-verification:
    post:
      consumes:
      - application/json
      parameters:
      - description: E-mail
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httphandler.resendVerificationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httphandler.messageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httphandler.errorResponse'
      summary: Reenviar e-mail de confirmação
      tags:
      - Auth
  /auth/reset-password:
    post:
      consumes:
      - application/json
      parameters:
      - description: Token e nova senha
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httphandler.resetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httphandler.messageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httphandler.errorResponse'
      summary: Redefinir senha
      tags:
      - Auth
  /auth/verify-email:
    post:
      consumes:
      - application/json
      parameters:
      - description: Token de verificação
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httphandler.verifyEmailRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httphandler.messageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httphandler.errorResponse'
      summary: Confirmar e-mail
      tags:
      - Auth
  /brand-catalogs:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.BrandCatalog'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httphandler.errorResponse'
      security:
      - BearerAuth: []
      summary: Listar catálogos de marca
      tags:
      - Catálogos de Marca
    post:
      consumes:
      - application/json
      parameters:
      - description: Dados do catálogo
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httphandler.createBrandCatalogRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.BrandCatalog'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httphandler.errorResponse'
      security:
      - BearerAuth: []
      summary: Cadastrar catálogo de marca
      tags:
      - Catálogos de Marca
  /brand-catalogs/{id}:
    delete:
      parameters:
      - description: ID do catálogo
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httphandler.messageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httphandler.errorResponse'
      security:
      - BearerAuth: []
      summary: Excluir catálogo de marca
      tags:
      - Catálogos de Marca
  /c/{id}:
    get:
      description: Gera uma página com metadados Open Graph (capa, título) para pré-visualização
        no WhatsApp e redireciona para o PDF no Google Drive.
      parameters:
      - description: ID do catálogo
        in: path
        name: id
        required: true
        type: string
      produces:
      - text/html
      responses:
        "200":
          description: HTML
          schema:
            type: string
      summary: Página de compartilhamento de catálogo
      tags:
      - Catálogos
  /capital-contributions:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.CapitalContribution'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httphandler.errorResponse'
      security:
      - BearerAuth: []
      summary: Listar aportes de capital
      tags:
      - Capital
    post:
      consumes:
      - application/json
      parameters:
      - description: Dados do aporte
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httphandler.createCapitalContributionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.CapitalContribution'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httphandler.errorResponse'
      security:
      - BearerAuth: []
      summary: Criar aporte de capital
      tags:
      - Capital
  /capital-contributions/{id}:
    delete:
      parameters:
      - description: ID do aporte
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httphandler.messageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httphandler.errorResponse'
      security:
      - BearerAuth: []
      summary: Excluir aporte de capital
      tags:
      - Capital
  /clients:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Client'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httphandler.errorResponse'
      security:
      - BearerAuth: []
      summary: Listar clientes
      tags:
      - Clientes
    post:
      consumes:
      - application/json
      parameters:
      - description: Dados do cliente
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/httphandler.clientRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.Client'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httphandler.errorResponse'
      security:
      - BearerAuth: []
      summary: Criar cliente
      tags:
      - Clientes
  /clients/{id}:
    delete:
      parameters:
      - description: ID do cliente
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httphandler.messageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httphandler.errorResponse'
      security:
      - BearerAuth: []
      summary: Excluir cliente
      tags:
      - Clientes
    get:
      parameters:
      - description: ID do cliente
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Client'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httphandler.errorResponse'
      security:
      - BearerAuth: []
      summary: Buscar cliente
      tags:
      - Clientes
    patch:
      consumes:
      - application/json
      parameters:
      - description: ID do cliente
        in: path
        name: id
